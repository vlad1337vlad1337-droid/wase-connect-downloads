name: Public repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-boundary:
    name: Public documentation and privacy boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate files, links and release status
        run: python3 .github/scripts/check_public_repository.py
      - name: Test publication boundaries
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check
